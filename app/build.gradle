plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pdflove.offline'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pdflove.offline'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
